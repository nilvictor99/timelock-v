services:
    app:
        build:
            context: '.'
            dockerfile: Dockerfile
        image: 'timelock-v-app'
        container_name: 'timelock-app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        env_file:
            - '.env'
        environment:
            # These values override any DATABASE_URL coming from .env so the app
            # always reaches the Compose-internal postgres service.
            DATABASE_URL: 'postgresql://timelock:timelock@postgres:5432/timelock?schema=public'
            NEXT_PUBLIC_APP_NAME: '${NEXT_PUBLIC_APP_NAME:-TimeLock-v}'
        ports:
            - '${APP_PORT:-3000}:3000'
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - timelock
        command: 'sh -c "npm run db:migrate && node server.js"'

    postgres:
        image: 'postgres:16-alpine'
        container_name: 'timelock-postgres'
        restart: unless-stopped
        environment:
            POSTGRES_USER: 'timelock'
            POSTGRES_PASSWORD: 'timelock'
            POSTGRES_DB: 'timelock'
        ports:
            - '${POSTGRES_PORT:-5432}:5432'
        volumes:
            - 'timelock_postgres:/var/lib/postgresql/data'
        networks:
            - timelock
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - 'timelock'
                - '-U'
                - 'timelock'
            interval: 5s
            timeout: 5s
            retries: 10

    pgadmin:
        image: 'dpage/pgadmin4:9.0'
        container_name: 'timelock-pgadmin'
        environment:
            PGADMIN_DEFAULT_EMAIL: 'admin@admin.com'
            PGADMIN_DEFAULT_PASSWORD: 'admin'
        ports:
            - '${PGADMIN_PORT:-5050}:80'
        depends_on:
            - postgres
        networks:
            - timelock

networks:
    timelock:
        driver: bridge

volumes:
    timelock_postgres:
        driver: local