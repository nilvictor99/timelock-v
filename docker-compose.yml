services:
  postgres:
    image: postgres:16-alpine
    container_name: timelock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: timelock
      POSTGRES_PASSWORD: timelock
      POSTGRES_DB: timelock
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - timelock_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timelock -d timelock"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: timelock-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://timelock:timelock@postgres:5432/timelock?schema=public
      NEXT_PUBLIC_APP_NAME: TimeLock-v
    ports:
      - "${APP_PORT:-3000}:3000"
    command: sh -c "npx prisma db push && node server.js"

volumes:
  timelock_postgres:
